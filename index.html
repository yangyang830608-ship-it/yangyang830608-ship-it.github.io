<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>方案一 · 液态镀铬未来主义</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Syne:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        /* 复制上方方案一的所有样式（从 .scheme-1 相关） + 基础 reset */
        * { margin:0; padding:0; box-sizing:border-box; }
        body { background:#000; font-family:'Space Grotesk',sans-serif; overflow-x:hidden; }
        .scheme-1 { min-height:100vh; background:radial-gradient(circle at 30% 10%, #0a0c12, #000000); display:flex; align-items:center; justify-content:center; }
        .container { width:90%; max-width:1400px; margin:0 auto; }
        .hero-layout { display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:2rem; }
        .visual-area { flex:1.2; min-height:400px; display:flex; justify-content:center; align-items:center; position:relative; }
        .info-area { flex:0.9; backdrop-filter:blur(8px); background:rgba(0,0,0,0.4); border-radius:48px; padding:2rem 2.5rem; border:1px solid rgba(255,255,255,0.15); }
        .liquid-chrome { width:320px; height:320px; background:linear-gradient(135deg, #e8eef2, #b0b8c5, #f5f9ff, #828a9a); background-size:300% 300%; border-radius:38% 62% 41% 59% / 57% 42% 58% 43%; animation: morphing 10s infinite ease-in-out, chromeShine 4s infinite alternate; box-shadow:0 0 60px rgba(0,255,255,0.3); }
        @keyframes morphing { 0% { border-radius:38% 62% 41% 59% / 57% 42% 58% 43%; } 50% { border-radius:63% 37% 72% 28% / 47% 58% 42% 53%; } 100% { border-radius:38% 62% 41% 59% / 57% 42% 58% 43%; } }
        @keyframes chromeShine { 0% { background-position:0% 50%; } 100% { background-position:100% 50%; box-shadow:0 0 80px #ff44cc; } }
        .chrometext { font-family:'Syne',sans-serif; font-weight:800; font-size:4.5rem; background:linear-gradient(135deg,#f0f0f0,#b6c2d9,#ffffff,#9ea7bb); background-clip:text; -webkit-background-clip:text; color:transparent; }
        .neon-tag { display:inline-block; background:rgba(255,42,109,0.2); border-radius:40px; padding:0.3rem 1rem; color:#ffb3d1; border:1px solid #ff2a6d; }
        .glow-text { color:#fff; border-left:3px solid #ff2a6d; padding-left:1rem; margin:1.5rem 0; }
        .social-links { display:flex; gap:1.5rem; margin-top:2rem; }
        .social-icon { color:#ccc; font-size:1.5rem; transition:0.2s; }
        .social-icon:hover { color:#ff66cc; text-shadow:0 0 8px #ff66cc; }
        @media (max-width:1000px) { .hero-layout{flex-direction:column; text-align:center;} .chrometext{font-size:2.8rem;} }
        /* 星芒动画略简，但保持风格 */
        .star-burst i { position:absolute; width:6px; height:6px; background:radial-gradient(circle,#ffdd77,#ff66cc); border-radius:50%; animation:twinkle 2s infinite alternate; }
        @keyframes twinkle { 0%{opacity:0.2;} 100%{opacity:1;transform:scale(1.4);} }
    </style>
</head>
<body>
    <section class="scheme-1">
        <div class="container"><div class="hero-layout"><div class="visual-area"><div class="liquid-chrome"></div><div class="star-burst"><i style="top:10%; left:15%;"></i><i style="top:70%; left:80%;"></i><i style="top:45%; left:5%;"></i></div></div><div class="info-area"><span class="neon-tag">✦ LIQUID VIBE 2025 ✦</span><h1 class="chrometext">STELLA<br>KRYSTAL</h1><div class="glow-text"><p>✧ 3D 视觉艺术家 · 数字化幻象建造者 ✧</p><p style="font-size:0.9rem;">液态金属 / 全息介质 / 未来主义叙事</p></div><div class="social-links"><a href="#" class="social-icon"><i class="fab fa-instagram"></i></a><a href="#" class="social-icon"><i class="fab fa-behance"></i></a><a href="#" class="social-icon"><i class="fab fa-github"></i></a></div><p style="margin-top:1.5rem;">📍 纽约 / 柏林  ·  开放合作</p></div></div></div>
    </section>
    <script>// 可复用动效脚本，也可忽略</script>
</body>
</html>
