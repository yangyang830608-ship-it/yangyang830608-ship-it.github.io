<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>方案二 · 酸性无序·涂鸦流体</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Inter:opsz@14..32&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body { background:#03030f; font-family:'Space Grotesk',sans-serif; overflow-x:hidden; }
        .scheme-2 { min-height:100vh; background:linear-gradient(145deg,#03030f 0%,#0a0515 100%); display:flex; align-items:center; justify-content:center; }
        .container { width:90%; max-width:1400px; margin:0 auto; }
        .hero-layout { display:flex; flex-wrap:wrap; align-items:center; gap:3rem; }
        .visual-area { flex:1; min-height:460px; position:relative; }
        .info-area { flex:1; background:rgba(0,0,0,0.35); backdrop-filter:blur(12px); border-radius:32px; padding:2rem; transform:rotate(-1deg); border:1px dashed #ff44aa; }
        .blob-3d { position:absolute; width:280px; height:280px; background:radial-gradient(circle at 30% 30%, rgba(255,130,200,0.7), rgba(0,255,255,0.3)); filter:blur(25px); border-radius:63% 37% 54% 46% / 38% 55% 45% 62%; animation:floatGlass 6s infinite alternate; top:20%; left:10%; }
        .blob-3d-second { position:absolute; width:200px; height:200px; background:radial-gradient(circle,#ff44cc,#00ffff); filter:blur(35px); border-radius:42% 58% 70% 30% / 44% 52% 48% 56%; bottom:10%; right:15%; animation:wobble 8s infinite alternate; }
        @keyframes floatGlass { 0%{transform:translate(0,0);} 100%{transform:translate(20px,-30px) rotate(8deg);} }
        @keyframes wobble { 0%{border-radius:42% 58% 70% 30% / 44% 52% 48% 56%;} 100%{border-radius:60% 40% 30% 70% / 55% 35% 65% 45%;} }
        .scribble { background:#ffd966; display:inline-block; padding:0.2rem 1rem; border-radius:60px; transform:rotate(-3deg); color:#000; }
        .sticky-note { background:#fffacd; padding:0.5rem 1rem; width:fit-content; transform:rotate(2deg); border-radius:12px; margin-top:1rem; }
        .neon-tag { display:inline-block; background:rgba(255,42,109,0.2); border-radius:40px; padding:0.3rem 1rem; color:#ffb3d1; border:1px solid #ff2a6d; }
        .social-links { display:flex; gap:1.5rem; margin-top:2rem; }
        .social-icon { color:#ccc; font-size:1.5rem; }
        .social-icon:hover { color:#ff66cc; }
        @media (max-width:1000px) { .hero-layout{flex-direction:column;} }
    </style>
</head>
<body>
    <section class="scheme-2"><div class="container"><div class="hero-layout"><div class="visual-area"><div class="blob-3d"></div><div class="blob-3d-second"></div><div class="sticky-note" style="position:absolute; bottom:-10px; right:20px;">ART? YES</div></div><div class="info-area"><span class="scribble">✧ ACID EDIT ✧</span><h1 style="font-size:3rem; margin:1rem 0; background:linear-gradient(125deg,#ffdb77,#ff6ac4); background-clip:text; -webkit-background-clip:text; color:transparent;">ROMEO VEGA</h1><p><i class="fas fa-bolt" style="color:#ff44aa;"></i> 无序创意指导 · 液态视觉游击</p><p style="margin-top:0.5rem;">“轻松、好奇和放松——设计是自由的游戏。”</p><div style="display:flex; gap:10px; margin-top:15px;"><span class="neon-tag">#GLITCH</span><span class="neon-tag">#Y2K REVIVAL</span></div><div class="social-links"><a href="#" class="social-icon"><i class="fab fa-tiktok"></i></a><a href="#" class="social-icon"><i class="fab fa-twitter"></i></a></div></div></div></div></section>
</body>
</html>
